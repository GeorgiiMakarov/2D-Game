# Деплой оригинальной версии игры (2d-game.html от 12.09) на GitHub Pages.
# FX-исходники остаются в ветке и истории, но больше не собираются и не деплоятся.
name: Deploy original game to GitHub Pages
on:
  push:
    branches: [crystal-depths-fx]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p site && cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
